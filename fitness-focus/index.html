<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fitness Focus</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Semi+Condensed:wght@600;700&display=swap" rel="stylesheet">
<!-- Visual (cores, tamanhos, modo escuro) -->
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<!-- O HTML é quase vazio de propósito: o JavaScript (js/app.js) preenche <main> e <nav> conforme a página escolhida. -->
<div class="wrap"><header><h1>Fitness Focus</h1><p class="sub" id="sub"></p><p class="sub" id="sync" style="font-size:13px;margin-top:-8px"></p></header><main id="main"></main> <!-- aqui aparece cada página (Início, Treino, Evolução...) --></div>
<div id="toast" hidden></div> <!-- avisos rápidos (lembrete de água, mensagens) -->
<nav id="nav"></nav> <!-- menu de baixo, desenhado pelo JavaScript -->
<!-- Lógica do aplicativo: dados, cálculos, páginas e eventos -->
<script src="js/app.js"></script>
</body>
</html>
